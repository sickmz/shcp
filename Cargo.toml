[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
shcp-core = { path = "crates/shcp-core" }
shcp-term = { path = "crates/shcp-term" }
alacritty_terminal = { version = "0.26.0", default-features = false }
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "sync", "time", "fs", "macros"] }
tokio-util = "0.7"
async-channel = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
shell-words = "1"
parking_lot = "0.12"
bitflags = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
aes = "0.9"
cbc = "0.2"
base64 = "0.22"
md5 = "0.8"
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# UI: the crates.io release of Zed's gpui, pinned exactly.
gpui = "=0.2.2"

[workspace.lints.rust]
unreachable_pub = "warn"
