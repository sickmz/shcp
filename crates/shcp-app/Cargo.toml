[package]
name = "shcp-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "shcp"
path = "src/main.rs"

[dependencies]
shcp-core.workspace = true
gpui.workspace = true
async-channel.workspace = true
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json.workspace = true
png = "0.18"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ureq = "3.5.1"
sha2 = "0.11"

[build-dependencies]
embed-resource = "3"
